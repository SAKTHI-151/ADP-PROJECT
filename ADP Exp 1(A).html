
<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>

<style>
*{
box-sizing:border-box;
}

body, html{
font-family: Arial, sans-serif;
background : pink;
}

.main-panel{
width:100%;
max-width:550px;
margin:50px auto;
background:white;
padding:20px 10px 50px 10px;
border-radius:5px;
}

h1{
font-size:35px;
text-align:center;
margin:0px;
}

.row{
display:flex;
}

.form-group{
margin-top:25px;
padding:10px;
flex-direction:column;
display:flex;
width:100%;
}

input, select, textarea{
width:100%;
padding:10px;
height:40px;
border:1px solid black;
border-radius:5px;
font-size:16px;
margin-top:5px;
}

textarea{
height:110px;
}

input[type="radio"], input[type="checkbox"]{
width:17px;
height:17px;
margin-left:5px;
position:relative;
top:2px;
}

button{
border:none;
width:100%;
height:42px;
font-size:16px;
cursor:pointer;
margin-top:40px;
border-radius:5px;
background:red;
color:white;
}

@media screen and (max-width:600px){
.row{
flex-wrap:wrap;
}
}
</style>

</head>

<body>

<div class="main-panel">
<h1>Student Registration Form</h1>

<div class="row">
<div class="form-group">
<label>Student Name</label>
<input type="text">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Mobile No.</label>
<input type="text">
</div>

<div class="form-group">
<label>Email Id</label>
<input type="email">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Father Name</label>
<input type="text">
</div>

<div class="form-group">
<label>Mother Name</label>
<input type="text">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Select Course</label>
<select>
<option>Select...</option>
<option>HTML</option>
<option>CSS</option>
<option>Java</option>
<option>Python</option>
</select>
</div>

<div class="form-group">
<label>Date Of Birth</label>
<input type="date">
</div>
</div>

<div class="row">
<div class="form-group">
<label>Gender</label>
<div>
<input type="radio" name="g"> Male
<input type="radio" name="g"> Female
</div>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Select Branch</label>
<div>
<input type="checkbox"> CSE
<input type="checkbox"> IT
<input type="checkbox"> ECE
<input type="checkbox"> Civil
</div>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Address</label>
<textarea></textarea>
</div>
</div>

<div class="row">
<button type="submit">Submit</button>
</div>

</div>

</body>
</html>
